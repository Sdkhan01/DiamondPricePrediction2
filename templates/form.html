<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluate Diamond Price</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #f8f9fa, #e0e0e0);
      color: #333;
    }
    header {
      background-color: #4a90e2;
      color: white;
      padding: 20px 10px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
    }
    section {
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #4a90e2;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .form-group {
      text-align: left;
    }
    label {
      font-size: 1rem;
      margin-bottom: 5px;
      display: inline-block;
      color: #4a90e2;
    }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input[type="submit"] {
      background-color: #4a90e2;
      color: white;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      padding: 10px;
      transition: background-color 0.3s ease;
    }
    input[type="submit"]:hover {
      background-color: #357ab7;
    }
    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    Diamond Price Predictor
  </header>
  <section>
    <div class="container">
      <h1>Evaluate Diamond Price</h1>
      <form action="{{url_for('predict_datapoint')}}" method="POST">
        <div class="form-group">
          <label for="carat">Carat:</label>
          <input type="text" id="carat" name="carat" placeholder="Enter carat value (float)">
        </div> 
        <div class="form-group">
          <label for="depth">Depth:</label>
          <input type="text" id="depth" name="depth" placeholder="Enter depth value (float)">
        </div>
        <div class="form-group">  
          <label for="table">Table:</label>
          <input type="text" id="table" name="table" placeholder="Enter table value (float)">
        </div>
        <div class="form-group">
          <label for="x">x:</label>
          <input type="text" id="x" name="x" placeholder="Enter x value (float)">
        </div>
        <div class="form-group">
          <label for="y">y:</label>
          <input type="text" id="y" name="y" placeholder="Enter y value (float)">
        </div>
        <div class="form-group">
          <label for="z">z:</label>
          <input type="text" id="z" name="z" placeholder="Enter z value (float)">
        </div>         
        <div class="form-group">
          <label for="cut">Cut:</label>
          <select id="cut" name="cut">
            <option value="Fair">Fair</option>
            <option value="Good">Good</option>
            <option value="Very Good">Very Good</option>
            <option value="Premium">Premium</option>
            <option value="Ideal">Ideal</option>
          </select>
        </div>
        <div class="form-group">
          <label for="color">Color:</label>
          <select id="color" name="color">
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="G">G</option>
            <option value="H">H</option>
            <option value="I">I</option>
            <option value="J">J</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clarity">Clarity:</label>
          <select id="clarity" name="clarity">
            <option value="I1">I1</option>
            <option value="SI2">SI2</option>
            <option value="SI1">SI1</option>
            <option value="VS2">VS2</option>
            <option value="VS1">VS1</option>
            <option value="VVS2">VVS2</option>
            <option value="VVS1">VVS1</option>
            <option value="IF">IF</option>
          </select>
        </div>
        <input type="submit" value="Evaluate Price">
      </form>
      <p>{{final_result}}</p>
    </div>
  </section>
  <footer>
    © 2025 Diamond Price Predictor | All Rights Reserved
  </footer>
</body>
</html>
